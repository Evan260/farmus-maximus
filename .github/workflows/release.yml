name: Release builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      steam_target:
        description: Steam app to upload to, when Steam uploads are switched on
        type: choice
        options: [playtest, game, demo]
        default: playtest

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - name: Check the tag matches the game's version
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^config\/version="\(.*\)"$/\1/p' game/project.godot)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error title=Version mismatch::The tag is $GITHUB_REF_NAME but config/version in game/project.godot is $version"
            exit 1
          fi

      - uses: ./.github/actions/setup-godot

      - name: Import
        run: godot --headless --path game --import

      - name: Run the tests
        run: |
          set -o pipefail
          timeout 20m godot --headless --path game -- --run-tests 2>&1 | tee test.log
          grep -q "ALL TESTS PASSED" test.log

  export:
    name: Export ${{ matrix.edition }} ${{ matrix.platform }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [windows, macos, linux]
        edition: [full, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
          persist-credentials: false

      - uses: ./.github/actions/setup-godot
        with:
          templates: "true"

      - name: Import
        run: godot --headless --path game --import

      - name: Export
        run: bash .github/scripts/export.sh ${{ matrix.platform }} ${{ matrix.edition }}

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform == 'macos' && 'macos-export' || 'release' }}-${{ matrix.edition }}-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error
          compression-level: 0

  macos:
    name: Sign ${{ matrix.edition }} macOS
    needs: export
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        edition: [full, demo]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            tools/steam

      - name: Download the macOS export
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: macos-export-${{ matrix.edition }}-macos
          path: export

      - name: Sign, notarize and zip
        run: bash .github/scripts/sign_macos.sh export ${{ matrix.edition }}
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.edition }}-macos
          path: dist/
          if-no-files-found: error
          compression-level: 0

  release:
    name: GitHub release
    needs: [test, export, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l artifacts
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "Farmus Maximus $GITHUB_REF_NAME" --generate-notes --verify-tag "${prerelease[@]}"
          fi

  steam:
    name: Steam upload
    needs: [test, export, macos]
    if: vars.STEAM_UPLOAD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: Upload to the testing branch
        run: bash .github/scripts/steam_upload.sh "$STEAM_TARGET"
        env:
          STEAM_TARGET: ${{ inputs.steam_target || vars.STEAM_TARGET || 'playtest' }}
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
